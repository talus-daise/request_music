<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放送再生ページ</title>
    <link rel="stylesheet" href="/assets/style.css" />
</head>

<body class="player">
    <div id="start-overlay" class="player-overlay">
        <h2>放送の準備ができました</h2>
        <button id="start-btn" class="primary-action">放送を開始する</button>
    </div>

    <div id="player-container" class="player-shell">
        <div id="yt" class="player-stage">
        </div>

        <div id="info-overlay" class="info-overlay">
            <div class="overlay-eyebrow">Now Playing</div>
            <div id="now" class="overlay-title">準備中...</div>
            
            <div class="overlay-block">
                <div class="overlay-label">リクエスト者:</div>
                <div id="requester" class="overlay-value">--</div>
            </div>

            <div id="countdown" class="overlay-countdown"></div>
            <button id="next-btn" class="next-button" type="button">次へ進む</button>
        </div>
    </div>

    <div id="confirm-modal" class="modal-backdrop" hidden style="display:none;">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
            <h2 id="confirm-title">本当にいいですか？</h2>
            <p>※この曲は再生済みとしてマークされます</p>
            <div class="modal-actions">
                <button id="cancel-next-btn" class="secondary-action" type="button">キャンセル</button>
                <button id="confirm-next-btn" class="danger-action" type="button">次へ進む</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/assets/player.js"></script>
</body>

</html>
