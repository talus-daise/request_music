<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放送再生ページ</title>
    <link rel="stylesheet" href="/assets/style.css" />
</head>

<body class="player">
    <!-- 初回再生開始用のオーバーレイ -->
    <div id="start-overlay"
        style="position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:white;">
        <h2 style="margin-bottom:20px;">放送の準備ができました</h2>
        <button id="start-btn"
            style="padding:15px 30px;font-size:1.2rem;cursor:pointer;border-radius:8px;border:none;background:#3498db;color:white;">放送を開始する</button>
    </div>

    <main class="container">
        <h1>ランダム再生</h1>
        <p id="now">準備中...</p>
        <p id="countdown"></p>
        <div class="video-wrap">
            <div id="yt">
                <!-- YouTubeプレーヤーがここに埋め込まれる -->
            </div>
        </div>
    </main>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/assets/player.js"></script>
</body>

</html>
