<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>リクエスト投稿</title>
  <link rel="stylesheet" href="/assets/style-new.css" />
</head>

<body>
  <main class="container">
    <section class="hero-card">
      <p class="eyebrow">Request Music</p>
      <h1>3Aリクエスト曲投稿</h1>
      <p class="hero-copy">放送で流したい曲を投稿するページです。曲一覧の確認や修正は管理ページから行えます。</p>
      <div class="hero-actions">
        <a class="button-link secondary" href="/manage/">曲一覧と編集へ</a>
        <a class="button-link ghost" href="/player/">再生ページへ</a>
      </div>
    </section>
    <form id="requestForm">
      <label>学籍番号<select id="student_id" required></select></label>
      <label>曲タイトル<input id="title" maxlength="120" required /></label>
      <label>おすすめポイント<textarea id="recommendation" maxlength="400"></textarea></label>
      <label>YouTubeリンク<input id="youtube_url" type="url" required /></label>
      <button type="submit">投稿する</button>
      <p id="message"></p>
    </form>

    <section class="panel dashboard-panel">
      <div class="section-head padded-heading">
        <h2>統計</h2>
        <label class="toggle-row"><input type="checkbox" id="unplayedOnly" checked /> <span>未再生のみ</span></label>
      </div>
      <div id="stats" class="stats-band compact"></div>

      <section class="panel-section">
        <div class="section-head padded-heading">
          <h2>投稿一覧</h2>
          <p class="section-note">投稿日時はJSTで表示しています。</p>
        </div>
        <div id="list" class="request-list"></div>
      </section>

      <section class="panel-section student-stats-section">
        <div class="section-head padded-heading">
          <h2>投稿者別統計</h2>
          <p class="section-note">投稿数・再生数・未再生数を投稿者ごとに確認できます。</p>
        </div>
        <div id="studentStatsSummary" class="student-stats-summary" aria-label="投稿者別統計の概要"></div>
        <div id="studentStats" class="student-stats-grid"></div>
      </section>

      <section class="panel-section">
        <div class="section-head padded-heading">
          <h2>再生履歴</h2>
          <p class="section-note">再生時刻はJSTで表示しています。</p>
        </div>
        <div id="history"></div>
      </section>
    </section>
  </main>
  <script type="module" src="/assets/request.js"></script>
</body>

</html>
